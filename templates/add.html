<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Post</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='form.css') }}">
</head>
<body>
    <div class="form-wrapper">
        <div class="form-container">
            <h2>Create a New Post</h2>
            <form method="POST" action="/add">
                <div class="input-group">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author" placeholder="Author name" required>
                </div>

                <div class="input-group">
                    <label for="title">Post Title</label>
                    <input type="text" id="title" name="title" placeholder="Give it a title" required>
                </div>

                <div class="input-group">
                    <label for="content">Content</label>
                    <textarea id="content" name="content" rows="5" placeholder="What's on your mind?" required></textarea>
                </div>

                <button type="submit" class="submit-btn">Publish Post</button>
            </form>
        </div>
    </div>
</body>
</html>
