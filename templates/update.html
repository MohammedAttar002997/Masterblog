<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Post</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='form.css') }}">
</head>
<body>
    <div class="form-wrapper">
        <div class="form-container">
            <h2>Update Post</h2>
            <form method="POST" action="{{ url_for('update', post_id=post.id) }}">
                <div class="input-group">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author" value="{{ post.author }}" required>
                </div>

                <div class="input-group">
                    <label for="title">Post Title</label>
                    <input type="text" id="title" name="title" value="{{ post.title }}" required>
                </div>

                <div class="input-group">
                    <label for="content">Content</label>
                    <textarea id="content" name="content" rows="5" required>{{ post.content }}</textarea>
                </div>

                <button type="submit" class="submit-btn" style="background-color: #f39c12;">Save Changes</button>

                <div style="text-align: center; margin-top: 15px;">
                    <a href="{{ url_for('index') }}" style="color: #666; font-size: 0.9rem;">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
