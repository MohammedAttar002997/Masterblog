<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flask Blog</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Welcome to My Flask Blog!</h1>

    <div class="posts-container">
        {% for post in posts %}
        <div class="post">
            <div class="post-header">
                <h2>{{post["title"]}}</h2>

                <div class="post-actions">
      <form action="{{ url_for('likes_increment', post_id=post['id']) }}" method="POST" style="display:inline;">
                <button type="submit" class="like-btn">
                    ❤️ {{ post.get('likes', 0) }}
                </button>
            </form>
                    <a href="{{ url_for('update', post_id=post['id']) }}" class="update-btn">Update</a>

                    <form action="{{ url_for('delete', post_id=post['id']) }}" method="POST" onsubmit="return confirm('Are you sure you want to delete this post?');" style="display:inline;">
                        <button type="submit" class="delete-btn">Delete</button>
                    </form>
                </div>
            </div>
            <p><em>Written by {{post["author"]}}</em></p>
            <p>{{post["content"]}}</p>
        </div>
        {% endfor %}
    </div>

    <div class="actions">
        <a href="{{ url_for('add') }}" class="add-button">Add New Post</a>
    </div>
</body>
</html>
